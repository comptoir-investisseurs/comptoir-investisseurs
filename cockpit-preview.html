<body class="admin-body">

<!-- ========== LOGIN ========== -->
<div class="login-wrap">
  <div class="login-card">
    <img src="assets/img/logo.png" alt="LFDR">
    <h2>Cockpit client</h2>
    <p>Connectez-vous pour accéder à la vue 360° et aux briefs pré-RDV.</p>
    <form id="login-form">
      <div class="q-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required>
      </div>
      <div class="q-field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--solid" type="submit">Se connecter</button>
      <p class="login-error"></p>
    </form>
    <p style="margin-top:18px;font-size:.78rem"><a href="admin.html" style="color:var(--gold)">← Retour au CRM</a></p>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div class="dash">

  <!-- Header -->
  <div class="dash-header"><div class="container">
    <img src="assets/img/logo-light.png" alt="LFDR">
    <div class="dash-header__right">
      <a href="admin.html" class="btn--logout" style="text-decoration:none">CRM</a>
      <a href="structures.html" class="btn--logout" style="text-decoration:none">Produits structurés</a>
      <span class="dash-header__user" id="dash-user-email"></span>
      <button class="btn--logout" id="btn-logout">Déconnexion</button>
    </div>
  </div></div>

  <div class="container" style="padding-top:24px;padding-bottom:60px">

    <!-- Stats -->
    <div class="dash-stats">
      <div class="dash-stat"><div class="dash-stat__num" id="stat-clients">—</div><div class="dash-stat__lbl">Clients suivis</div></div>
      <div class="dash-stat"><div class="dash-stat__num" id="stat-encours">—</div><div class="dash-stat__lbl">Encours total</div></div>
      <div class="dash-stat"><div class="dash-stat__num" id="stat-due">—</div><div class="dash-stat__lbl">Échéances 30 j</div></div>
      <div class="dash-stat"><div class="dash-stat__num" id="stat-compliance">—</div><div class="dash-stat__lbl">Dossiers à régulariser</div></div>
    </div>

    <!-- Toolbar -->
    <div class="ov-toolbar">
      <span class="ov-toolbar__lbl">Client</span>
      <div class="ov-select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13A4 4 0 0119 7"/></svg>
        <select id="ck-client"></select>
      </div>
      <button class="dash-btn-add" id="ck-brief-btn">＋ Générer le brief pré-RDV</button>
    </div>

    <div id="ck-body" class="sp-ov"></div>

  </div>
</div>

<!-- ========== MODALE SAISIE (enveloppe / support / document) ========== -->
<div class="dash-modal" id="ck-modal">
  <div class="dash-modal__card" style="max-width:560px">
    <div class="dash-modal__head">
      <h3 id="ck-modal-title">Saisie</h3>
      <button class="dash-modal__close" id="ck-modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="dash-modal__body" id="ck-modal-body"></div>
  </div>
</div>

<div id="ck-toast" class="sp-toast"></div>
