<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Immobilier patrimonial haut de gamme">
  <defs>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFC0C9"/><stop offset="1" stop-color="#E7DAC0"/>
    </linearGradient>
    <linearGradient id="rfac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8DDC6"/><stop offset="1" stop-color="#CCBC98"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#rsky)"/>
  <!-- left haussmann building -->
  <rect x="40" y="170" width="300" height="430" fill="url(#rfac)"/>
  <rect x="40" y="170" width="300" height="12" fill="#BCAB85"/>
  <g fill="#3c3c38">
    <rect x="70" y="210" width="46" height="70"/><rect x="150" y="210" width="46" height="70"/><rect x="230" y="210" width="46" height="70"/>
    <rect x="70" y="320" width="46" height="70"/><rect x="150" y="320" width="46" height="70"/><rect x="230" y="320" width="46" height="70"/>
    <rect x="70" y="430" width="46" height="70"/><rect x="150" y="430" width="46" height="70"/><rect x="230" y="430" width="46" height="70"/>
  </g>
  <g fill="#6f7a82" opacity="0.5"><rect x="70" y="210" width="46" height="70"/><rect x="150" y="320" width="46" height="70"/><rect x="230" y="430" width="46" height="70"/></g>
  <!-- right modern tower with glass -->
  <rect x="430" y="90" width="330" height="510" fill="#0f2d18"/>
  <g fill="#2f6b3a" opacity="0.55">
    <rect x="450" y="110" width="130" height="470"/><rect x="600" y="110" width="140" height="470"/>
  </g>
  <g stroke="#C9A86A" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="450" y1="180" x2="740" y2="180"/><line x1="450" y1="260" x2="740" y2="260"/>
    <line x1="450" y1="340" x2="740" y2="340"/><line x1="450" y1="420" x2="740" y2="420"/><line x1="450" y1="500" x2="740" y2="500"/>
    <line x1="595" y1="110" x2="595" y2="580"/>
  </g>
  <rect x="430" y="90" width="330" height="120" fill="#FBF0D2" opacity="0.10"/>
