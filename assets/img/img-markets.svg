<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Représentation abstraite des marchés financiers">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04240E"/><stop offset="1" stop-color="#001B00"/>
    </linearGradient>
    <linearGradient id="mline" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2f"/><stop offset="1" stop-color="#D6B873"/>
    </linearGradient>
    <linearGradient id="marea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A86A" stop-opacity="0.35"/><stop offset="1" stop-color="#C9A86A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mbg)"/>
  <!-- grid -->
  <g stroke="#C9A86A" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
  </g>
  <!-- area under curve -->
  <path d="M0 470 L120 430 L240 460 L360 360 L480 380 L600 250 L720 280 L800 180 L800 600 L0 600 Z" fill="url(#marea)"/>
  <!-- main ascending line -->
  <path d="M0 470 L120 430 L240 460 L360 360 L480 380 L600 250 L720 280 L800 180" fill="none" stroke="url(#mline)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- nodes -->
  <g fill="#F0DCAE">
    <circle cx="240" cy="460" r="5"/><circle cx="360" cy="360" r="5"/><circle cx="600" cy="250" r="6"/><circle cx="800" cy="180" r="6"/>
  </g>
  <!-- discreet bars -->
  <g fill="#C9A86A" fill-opacity="0.18">
    <rect x="60" y="500" width="22" height="70"/><rect x="180" y="470" width="22" height="100"/>
    <rect x="300" y="488" width="22" height="82"/><rect x="420" y="440" width="22" height="130"/>
    <rect x="540" y="410" width="22" height="160"/><rect x="660" y="380" width="22" height="190"/>
  </g>
</svg>
