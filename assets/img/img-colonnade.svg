<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Colonnade classique">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE7D6"/><stop offset="1" stop-color="#D8CBB0"/>
    </linearGradient>
    <linearGradient id="ccol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EEE0"/><stop offset="0.5" stop-color="#E6DAC1"/><stop offset="1" stop-color="#C8B895"/>
    </linearGradient>
    <linearGradient id="cshadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f6453" stop-opacity="0"/><stop offset="1" stop-color="#5b5337" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cbg)"/>
  <rect x="0" y="0" width="800" height="70" fill="#CBBC9B"/>
  <rect x="0" y="64" width="800" height="10" fill="#B7A782"/>
  <!-- columns -->
  <g>
    <g transform="translate(70,74)"><rect width="70" height="430" fill="url(#ccol)"/><rect x="-8" width="86" height="16" fill="#D9CBAB"/><rect x="-8" y="416" width="86" height="20" fill="#D9CBAB"/><rect x="6" y="0" width="6" height="430" fill="#fff" opacity="0.25"/></g>
    <g transform="translate(230,74)"><rect width="70" height="430" fill="url(#ccol)"/><rect x="-8" width="86" height="16" fill="#D9CBAB"/><rect x="-8" y="416" width="86" height="20" fill="#D9CBAB"/><rect x="6" y="0" width="6" height="430" fill="#fff" opacity="0.25"/></g>
    <g transform="translate(390,74)"><rect width="70" height="430" fill="url(#ccol)"/><rect x="-8" width="86" height="16" fill="#D9CBAB"/><rect x="-8" y="416" width="86" height="20" fill="#D9CBAB"/><rect x="6" y="0" width="6" height="430" fill="#fff" opacity="0.25"/></g>
    <g transform="translate(550,74)"><rect width="70" height="430" fill="url(#ccol)"/><rect x="-8" width="86" height="16" fill="#D9CBAB"/><rect x="-8" y="416" width="86" height="20" fill="#D9CBAB"/><rect x="6" y="0" width="6" height="430" fill="#fff" opacity="0.25"/></g>
    <g transform="translate(710,74)"><rect width="70" height="430" fill="url(#ccol)"/><rect x="-8" width="86" height="16" fill="#D9CBAB"/><rect x="-8" y="416" width="86" height="20" fill="#D9CBAB"/><rect x="6" y="0" width="6" height="430" fill="#fff" opacity="0.25"/></g>
  </g>
  <!-- floor -->
  <rect x="0" y="504" width="800" height="96" fill="#CABA98"/>
  <rect x="0" y="504" width="800" height="96" fill="url(#cshadow)"/>
  <!-- warm light wash -->
  <rect width="800" height="600" fill="#E9B86A" opacity="0.10"/>
</svg>
