<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilan patrimonial — La Financière de Rochechouart</title>
<meta name="description" content="Outil interne : conduite guidée de l'entretien de découverte et synthèse patrimoniale complète.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/monogram.svg">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/bilan.css">
</head>
<body class="bp-body">

<!-- ======================================================================
     ÉCRAN 1 — ACCUEIL : nouveau bilan / reprendre / importer
     ====================================================================== -->
<section id="bp-home" class="bp-home is-active">
  <div class="sl sl--cover">
    <div class="cov__green"></div>
    <div class="cov__wave cov__wave--l"></div><div class="cov__wave cov__wave--r"></div>
    <div class="cov__plate"></div>
    <img class="cov__photo" src="assets/img/escalier.jpg" alt="">
    <div class="cov__vline"></div>
    <img class="cov__logo" src="assets/img/logo-light.png" alt="La Financière de Rochechouart">
    <div class="cov__bar"></div>
    <div class="cov__title">Gestion privée &amp;<br>placement de trésorerie</div>
    <div class="cov__sub">Conseil sur mesure pour entrepreneurs, familles et dirigeants.</div>
    <div class="cov__actions">
      <button type="button" class="bp-btn bp-btn--gold" id="bp-new">Nouveau bilan</button>
      <button type="button" class="bp-tool" id="bp-resume" hidden>Reprendre</button>
      <label class="bp-tool bp-file">Importer (.json)<input type="file" id="bp-import" accept="application/json,.json"></label>
    </div>
    <div class="cov__hline"></div>
    <div class="cov__client">Bilan patrimonial — outil conseiller</div>
    <div class="cov__note">Les données restent dans ce navigateur. Exportez le fichier .json pour archiver ou transférer un dossier.</div>
  </div>
</section>

<!-- ======================================================================
     ÉCRAN 2 — ENTRETIEN GUIDÉ : une question par écran
     ====================================================================== -->
<section id="bp-wizard" class="bp-wizard">
  <div class="bp-progress"><div class="bp-progress__fill" id="bp-progress"></div></div>

  <header class="bp-top">
    <a href="index.html" class="bp-top__brand" aria-label="Accueil"><img src="assets/img/logo-light.png" alt="La Financière de Rochechouart"></a>
    <div class="bp-top__client" id="bp-top-client"></div>
    <div class="bp-top__tools">
      <button type="button" class="bp-tool" id="bp-save-json" title="Exporter le dossier (.json)">Exporter</button>
      <button type="button" class="bp-tool" id="bp-go-synth" title="Voir la synthèse">Synthèse</button>
      <button type="button" class="bp-tool" id="bp-quit" title="Retour à l'accueil">Quitter</button>
    </div>
  </header>

  <div class="bp-layout">
    <nav class="bp-rail" id="bp-rail" aria-label="Chapitres"></nav>
    <main class="bp-stage">
      <div class="bp-card" id="bp-card"></div>
      <div class="bp-nav">
        <button type="button" class="bp-back" id="bp-prev">← Précédent</button>
        <span class="bp-help" id="bp-help">Entrée pour continuer · Échap pour revenir</span>
        <button type="button" class="bp-btn bp-btn--gold" id="bp-next">Continuer →</button>
      </div>
    </main>
    <aside class="bp-live" id="bp-live" aria-label="Indicateurs en direct"></aside>
  </div>
</section>

<!-- ======================================================================
     ÉCRAN 3 — SYNTHÈSE : rendu type présentation (imprimable)
     ====================================================================== -->
<section id="bp-synth" class="bp-synth">
  <header class="bp-synth__bar no-print">
    <button type="button" class="bp-tool" id="bp-back-wizard">← Modifier les réponses</button>
    <div class="bp-synth__bar-right">
      <button type="button" class="bp-tool" id="bp-copy-brief">Copier la fiche sales</button>
      <button type="button" class="bp-tool" id="bp-save-json-2">Exporter .json</button>
      <button type="button" class="bp-btn bp-btn--gold" id="bp-print">Imprimer / PDF</button>
    </div>
  </header>
  <div class="bp-deck" id="bp-deck"></div>
</section>

<script src="assets/js/bilan.js"></script>
</body>
</html>
