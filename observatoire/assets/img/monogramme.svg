    <path d="M22 13.5v37" stroke-width="3.6"/>
    <path d="M22 13.5c7.5 0 15.3-.4 22.5-1.2" stroke-width="3.6"/>
    <path d="M22 31.2c5.6 0 11.4-.3 16.8-.9" stroke-width="3.6"/>
    <path d="M26.8 20.6c5.3-.2 10.6-.6 15.8-1.2" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
