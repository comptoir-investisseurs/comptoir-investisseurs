<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <rect width="200" height="200" fill="#F6F2E9"/>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#001B00" stroke-width="2"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#001B00" stroke-width="0.5"/>
  <!-- Text around circle path -->
  <defs>
    <path id="circlePath" d="M100,100 m-58,0 a58,58 0 1,1 116,0 a58,58 0 1,1 -116,0"/>
  </defs>
  <!-- Center monogram -->
  <text x="100" y="92" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="50" font-weight="600" letter-spacing="-1" fill="#001B00">LF</text>
  <line x1="65" y1="100" x2="135" y2="100" stroke="#A9853F" stroke-width="1.2"/>
  <text x="100" y="130" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="50" font-weight="600" letter-spacing="-1" fill="#001B00">DR</text>
  <!-- Gold dots at cardinal points -->
  <circle cx="100" cy="17" r="2.5" fill="#A9853F"/>
  <circle cx="100" cy="183" r="2.5" fill="#A9853F"/>
  <circle cx="17" cy="100" r="2.5" fill="#A9853F"/>
  <circle cx="183" cy="100" r="2.5" fill="#A9853F"/>
</svg>
